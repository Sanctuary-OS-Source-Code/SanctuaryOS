name: Release (Stable Channel)
on:
  push:
    tags:
      - 'v*'
      - 'V*'
      - '!*-dev*'
      - '!*-Dev*'
      - '!*-DEV*'
      - '!*.dev*'
      - '!*.Dev*'
      - '!*.DEV*'
      - '!dev-*'
      - '!Dev-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Stable release tag to build and attach assets to (e.g. v0.6.0)'
        required: false
        default: 'v0.6.0'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: "x86_64-pc-windows-msvc"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Sync version metadata from tag
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node << 'EOF'
          const fs = require("fs");
          const pkgPath = "./sanctuary-os/package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          let raw = (process.env.INPUT_TAG_NAME || process.env.REF_NAME || "").trim();
          let tag = raw;
          if (!tag || tag === "main" || tag === "master" || !/^[vV]?\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/.test(tag)) {
            tag = `v${pkg.version || "0.6.0"}`;
          }
          let cleanVer = tag.replace(/^[vV]/, "");
          if (!/^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/.test(cleanVer)) {
            cleanVer = "0.6.0";
          }
          const msiMatch = cleanVer.match(/^\d+\.\d+\.\d+/);
          const msiVer = msiMatch ? msiMatch[0] : "0.6.0";

          console.log(`Syncing Stable build version: package=${cleanVer}, msi=${msiVer} (tag=${tag})`);

          pkg.version = cleanVer;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

          const tauriPath = "./sanctuary-os/src-tauri/tauri.conf.json";
          const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
          tauri.version = msiVer;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");

          const cargoPath = "./sanctuary-os/src-tauri/Cargo.toml";
          let cargo = fs.readFileSync(cargoPath, "utf8");
          cargo = cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${msiVer}"`);
          fs.writeFileSync(cargoPath, cargo);
          EOF

      - name: install dependencies
        run: npm install
        working-directory: ./sanctuary-os

      - name: Ensure GitHub Stable release exists before parallel upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          TAG="${TARGET_TAG}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v0.6.0"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Sanctuary OS $TAG" --notes "See the assets to download this version and install." || true

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./sanctuary-os
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'Sanctuary OS ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Ensure Stable release is marked Latest and Dev releases are Pre-release
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = if ($env:INPUT_TAG_NAME) { $env:INPUT_TAG_NAME } else { $env:REF_NAME }
          $tag = "$raw".Trim()
          try {
            $rels = gh release list --limit 15 --json tagName,isPrerelease | ConvertFrom-Json
            foreach ($r in $rels) {
              if ($r.tagName -match '(?i)dev' -and -not $r.isPrerelease) {
                Write-Host "Marking dev release $($r.tagName) as pre-release..."
                gh release edit $r.tagName --prerelease 2>$null
              }
            }
            if ($tag -and ($tag -match '^[vV]?\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$') -and $tag -notmatch '(?i)dev') {
              Write-Host "Marking $tag as Latest Stable release..."
              gh release edit $tag --prerelease=false --latest 2>$null
            }
          } catch {
            Write-Host "Notice: Could not update release flags via gh CLI: $_"
          }
