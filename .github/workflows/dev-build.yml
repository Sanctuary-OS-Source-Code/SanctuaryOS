name: Daily Dev Build (Supporter Channel)
on:
  push:
    tags:
      - 'v*-dev*'
      - 'dev-*'
  workflow_dispatch:
    inputs:
      dev_version_label:
        description: 'Daily Dev Build label (e.g. v0.5.6-dev.1)'
        required: false
        default: 'Nightly Dev Build'
      release_notes:
        description: 'Markdown patch notes for Daily Dev Build supporters'
        required: false
        default: 'Automated Daily Dev Build for Sanctuary OS Ecosystem Supporters.'

jobs:
  dev-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: install rust targets for macos
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: install dependencies
        run: npm install
        working-directory: ./sanctuary-os
      - name: build and publish to dev-latest channel
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./sanctuary-os
          tagName: dev-latest
          releaseName: 'Sanctuary OS Daily Dev Build (${{ github.event.inputs.dev_version_label || github.ref_name }})'
          releaseBody: '${{ github.event.inputs.release_notes || github.event.head_commit.message || ''Daily Dev Build for Sanctuary OS Ecosystem Supporters. Unlocked globally via any $5+ Partner or Keepers Core contribution.'' }}'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

