name: Dev Build (Supporter Channel)
on:
  push:
    tags:
      - 'v*-dev*'
      - 'v*-Dev*'
      - 'v*-DEV*'
      - 'V*-dev*'
      - 'V*-Dev*'
      - 'V*-DEV*'
      - 'v*.dev*'
      - 'v*.Dev*'
      - 'v*.DEV*'
      - 'V*.dev*'
      - 'V*.Dev*'
      - 'V*.DEV*'
      - 'dev-*'
      - 'Dev-*'
  workflow_dispatch:
    inputs:
      dev_version_label:
        description: 'Dev Build tag (e.g. v0.6.0-dev.1)'
        required: false
        default: 'v0.6.0-dev.1'
      release_notes:
        description: 'Markdown patch notes for Dev Build supporters'
        required: false
        default: 'Automated Dev Build for Sanctuary OS Ecosystem Supporters.'

jobs:
  dev-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: "x86_64-pc-windows-msvc"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: "x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect project directory
        id: paths
        shell: bash
        run: |
          if [ -f "./sanctuary-os/package.json" ]; then
            echo "dir=./sanctuary-os" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: install Linux WebKitGTK & AppImage dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libstdc++6 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config build-essential file wget

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Sync Dev version metadata from tag
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.paths.outputs.dir }}
          INPUT_DEV_VERSION: ${{ github.event.inputs.dev_version_label }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const proj = process.env.PROJECT_DIR || "./sanctuary-os";
          const raw = (process.env.INPUT_DEV_VERSION || process.env.REF_NAME || "").trim();
          let tag = raw;
          if (!tag || tag === "main" || tag === "master" || !/^[vV]?\d+\.\d+\.\d+([.-][a-zA-Z0-9.-]+)?$/.test(tag)) {
            tag = "v0.6.0-dev.1";
          }
          let cleanDevVer = tag
            .replace(/^[vV]/, "")
            .replace(/^(\d+\.\d+\.\d+)\.([a-zA-Z])/, "$1-$2")
            .toLowerCase();
          const msiMatch = cleanDevVer.match(/^\d+\.\d+\.\d+/);
          const msiVer = msiMatch ? msiMatch[0] : "0.6.0";
          if (!/^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/.test(cleanDevVer)) {
            cleanDevVer = `${msiVer}-dev.1`;
          }
          const numMatch = cleanDevVer.match(/(\d+)\s*$/);
          const devNum = numMatch ? Math.min(65535, Math.max(1, parseInt(numMatch[1], 10) || 1)) : 1;
          const wixVer = `${msiVer}.${devNum}`;

          console.log(`Syncing Dev build version (${proj}): semver=${cleanDevVer}, wix=${wixVer} (tag=${tag})`);

          const pkgPath = path.join(proj, "package.json");
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          pkg.version = cleanDevVer;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

          const tauriPath = path.join(proj, "src-tauri/tauri.conf.json");
          const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
          tauri.version = cleanDevVer;
          tauri.bundle = tauri.bundle || {};
          tauri.bundle.windows = tauri.bundle.windows || {};
          tauri.bundle.windows.wix = {
            ...(tauri.bundle.windows.wix || {}),
            version: wixVer,
          };
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");

          const cargoPath = path.join(proj, "src-tauri/Cargo.toml");
          let cargo = fs.readFileSync(cargoPath, "utf8");
          cargo = cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${cleanDevVer}"`);
          fs.writeFileSync(cargoPath, cargo);
          EOF

      - name: Run Rust unit tests
        run: cargo test
        working-directory: ${{ steps.paths.outputs.dir }}/src-tauri

      - name: install dependencies
        run: npm install
        working-directory: ${{ steps.paths.outputs.dir }}

      - name: Edge Functions TypeScript check
        if: matrix.platform == 'ubuntu-22.04'
        run: npx tsc -p supabase/functions/tsconfig.json --noEmit
        working-directory: ${{ steps.paths.outputs.dir }}

      - name: Run Ironclad Gauntlet unit tests
        if: matrix.platform == 'ubuntu-22.04'
        run: npm test
        working-directory: ${{ steps.paths.outputs.dir }}

      - name: Ensure draft Dev GitHub release exists before parallel upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event.inputs.dev_version_label || github.ref_name }}
          REL_NOTES: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Daily Dev Build for Sanctuary OS Ecosystem Supporters. Unlocked globally via any $5+ Partner or Keepers Core contribution.' }}
        run: |
          TAG="${TARGET_TAG}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v0.6.0-dev.1"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Version $TAG" --notes "$REL_NOTES" --draft --prerelease || true

      - name: build and upload Dev binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets[format('{0}CERTIFICATE', runner.os == 'macOS' && 'APPLE_' || '')] }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets[format('{0}CERTIFICATE_PASSWORD', runner.os == 'macOS' && 'APPLE_' || '')] }}
          APPLE_SIGNING_IDENTITY: ${{ secrets[format('{0}SIGNING_IDENTITY', runner.os == 'macOS' && 'APPLE_' || '')] || (matrix.platform == 'macos-latest' && '-' || '') }}
          APPLE_ID: ${{ secrets[format('{0}ID', runner.os == 'macOS' && 'APPLE_' || '')] }}
          APPLE_PASSWORD: ${{ secrets[format('{0}PASSWORD', runner.os == 'macOS' && 'APPLE_' || '')] }}
          APPLE_TEAM_ID: ${{ secrets[format('{0}TEAM_ID', runner.os == 'macOS' && 'APPLE_' || '')] }}
          VITE_SANCTUARY_BUILD_CHANNEL: "dev"
          SANCTUARY_SKIP_SPOKE_PULL: "1"
          NO_STRIP: true
          NODE_OPTIONS: "--max-old-space-size=4096"
        with:
          projectPath: ${{ steps.paths.outputs.dir }}
          tagName: ${{ github.event.inputs.dev_version_label || github.ref_name }}
          releaseName: 'Version ${{ github.event.inputs.dev_version_label || github.ref_name }}'
          releaseBody: '${{ github.event.inputs.release_notes || github.event.head_commit.message || ''Daily Dev Build for Sanctuary OS Ecosystem Supporters. Unlocked globally via any $5+ Partner or Keepers Core contribution.'' }}'
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  finalize-dev-release:
    needs: [dev-release]
    if: always() && needs.dev-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate unified latest.json, mirror to dev-latest & publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_DEV_VERSION: ${{ github.event.inputs.dev_version_label }}
          REF_NAME: ${{ github.ref_name }}
          REL_NOTES: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Daily Dev Build for Sanctuary OS Ecosystem Supporters. Unlocked globally via any $5+ Partner or Keepers Core contribution.' }}
        run: |
          TAG="${INPUT_DEV_VERSION:-$REF_NAME}"
          TAG="$(echo "$TAG" | xargs)"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v0.6.0-dev.1"
          fi
          mkdir -p ./sigs
          gh release download "$TAG" --pattern "*.sig" -D ./sigs || true
          gh release view "$TAG" --json assets,body,publishedAt > ./release.json

          export RESOLVED_TAG="$TAG"
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const tag = process.env.RESOLVED_TAG || "v0.6.0-dev.1";
          let cleanDevVer = tag
            .replace(/^[vV]/, "")
            .replace(/^(\d+\.\d+\.\d+)\.([a-zA-Z])/, "$1-$2")
            .toLowerCase();
          if (!/^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/.test(cleanDevVer)) {
            const m = cleanDevVer.match(/^\d+\.\d+\.\d+/);
            cleanDevVer = `${m ? m[0] : "0.6.0"}-dev.1`;
          }

          const rel = JSON.parse(fs.readFileSync("./release.json", "utf8"));
          const assets = Array.isArray(rel.assets) ? rel.assets : [];
          const byName = new Map(assets.map((a) => [a.name, a]));
          const platforms = {};

          const sigFiles = fs.existsSync("./sigs") ? fs.readdirSync("./sigs").filter((f) => f.endsWith(".sig")) : [];
          for (const sigFile of sigFiles) {
            const targetName = sigFile.slice(0, -4);
            const asset = byName.get(targetName);
            if (!asset) continue;
            const signature = fs.readFileSync(path.join("./sigs", sigFile), "utf8").trim();
            if (!signature) continue;
            const downloadUrl =
              asset && typeof asset.url === "string" && asset.url.includes("/releases/download/")
                ? asset.url
                : `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(targetName)}`;

            const lower = targetName.toLowerCase();
            if (lower.endsWith(".nsis.zip") || lower.endsWith("-setup.exe") || lower.endsWith(".exe") || lower.endsWith(".msi")) {
              const key = lower.includes("arm64") || lower.includes("aarch64") ? "windows-aarch64" : "windows-x86_64";
              // Prefer NSIS (.nsis.zip / .exe) over .msi when both have signatures
              if (!platforms[key] || !lower.endsWith(".msi")) {
                platforms[key] = { signature, url: downloadUrl };
              }
            } else if (lower.endsWith(".app.tar.gz")) {
              if (lower.includes("universal")) {
                platforms["darwin-universal"] = { signature, url: downloadUrl };
                platforms["darwin-aarch64"] = platforms["darwin-aarch64"] || { signature, url: downloadUrl };
                platforms["darwin-x86_64"] = platforms["darwin-x86_64"] || { signature, url: downloadUrl };
              } else if (lower.includes("aarch64") || lower.includes("arm64")) {
                platforms["darwin-aarch64"] = { signature, url: downloadUrl };
              } else {
                platforms["darwin-x86_64"] = { signature, url: downloadUrl };
              }
            } else if (lower.endsWith(".appimage.tar.gz") || lower.endsWith(".appimage")) {
              const key = lower.includes("aarch64") || lower.includes("arm64") ? "linux-aarch64" : "linux-x86_64";
              if (!platforms[key] || lower.endsWith(".appimage.tar.gz")) {
                platforms[key] = { signature, url: downloadUrl };
              }
            }
          }

          const manifest = {
            version: cleanDevVer,
            notes: rel.body || process.env.REL_NOTES || "Automated Dev Build for Sanctuary OS Ecosystem Supporters.",
            pub_date: rel.publishedAt || new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync("./latest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log("Generated dev latest.json platforms:", Object.keys(platforms));
          EOF

          gh release upload "$TAG" ./latest.json --clobber
          gh release view dev-latest >/dev/null 2>&1 || gh release create dev-latest --title "Sanctuary OS Dev Channel (Latest)" --notes "$REL_NOTES" --prerelease || true
          gh release upload dev-latest ./latest.json --clobber
          gh release edit "$TAG" --draft=false --prerelease

          LATEST_STABLE=$(gh release list --limit 25 --json tagName,isDraft,isPrerelease -q '.[] | select(.isDraft == false and (.tagName | test("dev"; "i") | not)) | .tagName' | head -n 1 || true)
          if [ -n "$LATEST_STABLE" ]; then
            gh release edit "$LATEST_STABLE" --prerelease=false --latest || true
          fi
