name: Dev Build (Supporter Channel)
on:
  push:
    tags:
      - 'v*-dev*'
      - 'v*-Dev*'
      - 'v*-DEV*'
      - 'V*-dev*'
      - 'V*-Dev*'
      - 'V*-DEV*'
      - 'v*.dev*'
      - 'v*.Dev*'
      - 'v*.DEV*'
      - 'V*.dev*'
      - 'V*.Dev*'
      - 'V*.DEV*'
      - 'dev-*'
      - 'Dev-*'
  workflow_dispatch:
    inputs:
      dev_version_label:
        description: 'Dev Build tag (e.g. v0.6.0-dev.1)'
        required: false
        default: 'v0.6.0-dev.1'
      release_notes:
        description: 'Markdown patch notes for Dev Build supporters'
        required: false
        default: 'Automated Dev Build for Sanctuary OS Ecosystem Supporters.'

jobs:
  dev-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: "x86_64-pc-windows-msvc"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Sync Dev version metadata from tag
        shell: bash
        env:
          INPUT_DEV_VERSION: ${{ github.event.inputs.dev_version_label }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node << 'EOF'
          const fs = require("fs");
          const raw = (process.env.INPUT_DEV_VERSION || process.env.REF_NAME || "").trim();
          let tag = raw;
          if (!tag || tag === "main" || tag === "master" || !/^[vV]?\d+\.\d+\.\d+([.-][a-zA-Z0-9.-]+)?$/.test(tag)) {
            tag = "v0.6.0-dev.1";
          }
          let cleanDevVer = tag.replace(/^[vV]/, "").replace(/^(\d+\.\d+\.\d+)\.([a-zA-Z])/, "$1-$2").toLowerCase();
          const msiMatch = cleanDevVer.match(/\d+\.\d+\.\d+/);
          const msiVer = msiMatch ? msiMatch[0] : "0.6.0";
          if (!/^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/.test(cleanDevVer)) {
            cleanDevVer = `${msiVer}-dev.1`;
          }

          console.log(`Syncing Dev build version: package=${cleanDevVer}, msi=${msiVer} (tag=${tag})`);

          const pkgPath = "./sanctuary-os/package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          pkg.version = cleanDevVer;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

          const tauriPath = "./sanctuary-os/src-tauri/tauri.conf.json";
          const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
          tauri.version = msiVer;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");

          const cargoPath = "./sanctuary-os/src-tauri/Cargo.toml";
          let cargo = fs.readFileSync(cargoPath, "utf8");
          cargo = cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${msiVer}"`);
          fs.writeFileSync(cargoPath, cargo);
          EOF

      - name: install dependencies
        run: npm install
        working-directory: ./sanctuary-os

      - name: Ensure GitHub Dev release exists before parallel upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event.inputs.dev_version_label || github.ref_name }}
          REL_NOTES: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Daily Dev Build for Sanctuary OS Ecosystem Supporters. Unlocked globally via any $5+ Partner or Keepers Core contribution.' }}
        run: |
          TAG="${TARGET_TAG}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v0.6.0-dev.1"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Version $TAG" --notes "$REL_NOTES" --prerelease || true

      - name: build and publish to Dev release tag
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SANCTUARY_BUILD_CHANNEL: "dev"
        with:
          projectPath: ./sanctuary-os
          tagName: ${{ github.event.inputs.dev_version_label || github.ref_name }}
          releaseName: 'Version ${{ github.event.inputs.dev_version_label || github.ref_name }}'
          releaseBody: '${{ github.event.inputs.release_notes || github.event.head_commit.message || ''Daily Dev Build for Sanctuary OS Ecosystem Supporters. Unlocked globally via any $5+ Partner or Keepers Core contribution.'' }}'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Ensure Dev release is marked Pre-release and Stable remains Latest
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_DEV_VERSION: ${{ github.event.inputs.dev_version_label }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = if ($env:INPUT_DEV_VERSION) { $env:INPUT_DEV_VERSION } else { $env:REF_NAME }
          $tag = "$raw".Trim()
          try {
            if ($tag -and ($tag -match '^[vV]?\d+\.\d+\.\d+([.-][a-zA-Z0-9.-]+)?$')) {
              Write-Host "Ensuring $tag is marked as pre-release..."
              gh release edit $tag --prerelease 2>$null
            }
            $rels = gh release list --limit 15 --json tagName,isPrerelease,isDraft | ConvertFrom-Json
            foreach ($r in $rels) {
              if ($r.tagName -match '(?i)dev' -and -not $r.isPrerelease) {
                gh release edit $r.tagName --prerelease 2>$null
              }
            }
            $latestStable = $rels | Where-Object { -not $_.isDraft -and ($_.tagName -notmatch '(?i)dev') } | Select-Object -First 1
            if ($latestStable) {
              Write-Host "Ensuring $($latestStable.tagName) remains marked as Latest Stable release..."
              gh release edit $latestStable.tagName --prerelease=false --latest 2>$null
            }
          } catch {
            Write-Host "Notice: Could not update release flags via gh CLI: $_"
          }
