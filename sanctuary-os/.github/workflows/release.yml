name: Release (Stable Channel)
on:
  push:
    tags:
      - 'v*'
      - '!*-dev*'
      - '!*-Dev*'
      - '!*-DEV*'
      - '!dev-*'
      - '!Dev-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Stable release tag to build and attach assets to (e.g. v0.5.8)'
        required: false
        default: 'v0.5.8'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version metadata from tag and clean stale release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          RAW_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          $tag = "$env:RAW_TAG".Trim()
          if (-not $tag -or $tag -eq "main" -or $tag -eq "master") {
            $pkg = Get-Content "./sanctuary-os/package.json" -Raw | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }
          $cleanVer = $tag -replace '^[vV]', ''
          $msiMatch = [regex]::Match($cleanVer, '^\d+\.\d+\.\d+')
          $msiVer = if ($msiMatch.Success) { $msiMatch.Value } else { "0.5.8" }

          Write-Host "Syncing Stable build version: package=$cleanVer, msi=$msiVer (tag=$tag)"

          node -e "
            const fs = require('fs');
            const pkgPath = './sanctuary-os/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$cleanVer';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            const tauriPath = './sanctuary-os/src-tauri/tauri.conf.json';
            const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            tauri.version = '$msiVer';
            fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

            const cargoPath = './sanctuary-os/src-tauri/Cargo.toml';
            let cargo = fs.readFileSync(cargoPath, 'utf8');
            cargo = cargo.replace(/^version\s*=\s*\"[^\"]*\"/m, 'version = \"$cleanVer\"');
            fs.writeFileSync(cargoPath, cargo);
          "

      - name: install dependencies
        run: npm install
        working-directory: ./sanctuary-os

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./sanctuary-os
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'Sanctuary OS ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
