<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2737" />
  <meta name="color-scheme" content="dark" /><meta name="darkreader-lock" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sanctuary OS" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png?v=sovereign_v8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=sovereign_v8" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Sanctuary OS</title>
  <style>
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100lvh;
      overflow: hidden;
      background-color: var(--bg, #040812);
      background-image: var(--boot-bg-image, url("/themes/architect.png"));
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color-scheme: dark;
    }
    body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100lvh;
      overflow: hidden;
      background-color: transparent !important;
      color-scheme: dark;
    }
    @media (max-width: 767px) {
      html:not([data-sa-platform="linux"]),
      html:not([data-sa-platform="linux"]) body,
      html:not([data-sa-platform="linux"]) #root {
        height: auto !important;
        min-height: 100dvh !important;
        min-height: 100lvh !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
      }
      html:not([data-sa-bottom-e2e="true"]),
      html:not([data-sa-bottom-e2e="true"]) body {
        background-color: var(--sa-bottom-bar-blend, #0e2244) !important;
      }
      html[data-sa-bottom-e2e="true"],
      html[data-sa-bottom-e2e="true"] body,
      #root {
        background-color: transparent !important;
      }
    }
  </style>
  <script src="/boot-theme.js"></script>
</head>

<body>
  <div id="root"></div>
  <div id="sa-portals"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
